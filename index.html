<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Smart Plant QR - SMPN 19 Kota Pontianak</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#16a34a"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Pacifico&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<style>
:root{--g:#16a34a;--t:#0d9488;--p:#7c3aed;--tx:#1e293b}
*{box-sizing:border-box;margin:0}
body{font-family:Poppins,sans-serif;background:linear-gradient(160deg,#ecfdf5,#e0f2fe 60%,#fdf4ff) fixed;color:var(--tx);min-height:100vh;padding-bottom:90px}
.app{max-width:760px;margin:auto;padding:14px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:14px}
.brand{display:flex;gap:10px;align-items:center}
.logo{width:50px;height:50px;border-radius:16px;background:linear-gradient(135deg,var(--g),var(--t));display:grid;place-items:center;font-size:26px;overflow:hidden;box-shadow:0 6px 16px #16a34a44}
.logo img{width:100%;height:100%;object-fit:cover}
h1{font-family:Pacifico,cursive;font-size:22px;font-weight:400;background:linear-gradient(90deg,var(--g),var(--t),var(--p));-webkit-background-clip:text;background-clip:text;color:transparent}
small{color:#64748b;font-size:11px;font-weight:600}
.btn{border:0;border-radius:14px;padding:10px 14px;font:600 13px Poppins;cursor:pointer;color:#fff;text-decoration:none;display:inline-block;background:linear-gradient(135deg,var(--p),#ec4899);box-shadow:0 6px 14px #7c3aed33}
.btn.g{background:linear-gradient(135deg,var(--g),var(--t))}.btn.r{background:linear-gradient(135deg,#ef4444,#f97316)}.btn.w{background:#fff;color:var(--tx);box-shadow:0 2px 8px #0001}
.hero{border-radius:26px;overflow:hidden;min-height:270px;background:linear-gradient(135deg,#34d399,#38bdf8) center/cover;color:#fff;display:flex;align-items:flex-end;box-shadow:0 12px 28px #0d948833}
.hero>div{padding:7px 14px;width:100%;background:#064e3b8c}
.hero h2{font-size:13px;font-weight:600;line-height:1.3}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
.stat{border-radius:22px;padding:16px;color:#fff;text-align:center;font-weight:600}.stat b{display:block;font-size:36px}
.s1{background:linear-gradient(135deg,#22c55e,#14b8a6)}.s2{background:linear-gradient(135deg,#f59e0b,#ef4444)}
.panel{background:#fff;border-radius:22px;padding:16px;margin-bottom:12px;box-shadow:0 4px 16px #0001}
.panel h2,.panel h3{background:linear-gradient(90deg,var(--p),#ec4899);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:6px}
.panel p{line-height:1.6;font-size:14px;white-space:pre-line}
.fact{background:linear-gradient(135deg,#fef3c7,#fce7f3)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px dashed #e2e8f0;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{background:#fff;border-radius:20px;overflow:hidden;text-decoration:none;color:inherit;box-shadow:0 4px 14px #0001;transition:.2s}.card:hover{transform:translateY(-4px)}
.card img{width:100%;height:120px;object-fit:cover}.ci{padding:10px}.ci i{display:block;font-size:11px;color:#64748b}.ci b{font-size:14px;color:var(--g)}
.tag{display:inline-block;background:#dcfce7;color:#15803d;border-radius:99px;padding:2px 10px;font-size:11px;font-weight:600;margin:4px 0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px}.chips.wrap{flex-wrap:wrap}
.chip{border:0;white-space:nowrap;padding:8px 14px;border-radius:99px;background:#fff;font:600 12px Poppins;cursor:pointer;box-shadow:0 2px 6px #0001}
.chip.on{background:linear-gradient(135deg,var(--g),var(--t));color:#fff}
nav{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);width:calc(100% - 20px);max-width:520px;display:flex;background:#fffffff2;backdrop-filter:blur(10px);border-radius:24px;padding:8px;box-shadow:0 8px 28px #0002;z-index:5}
nav a{flex:1;text-align:center;text-decoration:none;color:#64748b;font-size:11px;font-weight:600;padding:6px;border-radius:16px}
nav a span{display:block;font-size:20px}nav a.on{background:linear-gradient(135deg,#dcfce7,#e0f2fe);color:var(--g)}
.pimg{width:100%;max-height:340px;object-fit:cover;border-radius:22px}
.ic{display:flex;gap:10px;margin:12px 0;align-items:center}
.pill{border:0;border-radius:99px;padding:9px 16px;background:#fff;font:600 13px Poppins;box-shadow:0 2px 8px #0001}button.pill{cursor:pointer}
input,textarea{width:100%;padding:11px 13px;border:2px solid #e2e8f0;border-radius:14px;font:14px Poppins;margin:4px 0 10px;background:#fff}
input:focus,textarea:focus{outline:0;border-color:var(--g)}
label.l{font-weight:600;font-size:13px;color:var(--t)}
#modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;z-index:9;padding:16px}
.mbox{background:#fff;border-radius:24px;padding:22px;width:100%;max-width:360px;text-align:center}
#toast{position:fixed;top:16px;left:50%;transform:translate(-50%,-90px);background:#1e293b;color:#fff;padding:10px 18px;border-radius:99px;font-size:13px;transition:.3s;z-index:20}#toast.show{transform:translate(-50%,0)}
html,body{touch-action:pan-x pan-y}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
input,textarea{-webkit-user-select:text;user-select:text}
img{-webkit-user-drag:none;-webkit-touch-callout:none}
.s3{grid-column:1/-1;background:linear-gradient(135deg,#6366f1,#ec4899)}
.aimg{width:100%;max-height:220px;object-fit:cover;border-radius:16px;margin-bottom:8px}
.cl{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
@media print{body>:not(#modal){display:none!important}#modal{position:static;background:none;display:block!important}.noprint{display:none}}
.gh{background:linear-gradient(135deg,#059669,#10b981);color:#fff;border-radius:24px;padding:18px;margin-bottom:14px;box-shadow:0 8px 20px #05966933}.gh h2{font-size:22px;margin-bottom:4px}.gh p{font-size:13px}
.gg{display:grid;grid-template-columns:1fr 1fr;gap:12px}.gc{background:#fff;border-radius:24px;padding:18px 10px;text-align:center;text-decoration:none;color:var(--tx);font-weight:600;font-size:14px;box-shadow:0 4px 16px #0001;display:block}.gc:active{transform:scale(.97)}
.gc i{display:grid;place-items:center;width:58px;height:58px;border-radius:18px;margin:0 auto 10px;font-size:28px;font-style:normal}
.gal{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;margin-bottom:8px}.gal img{flex:0 0 85%;scroll-snap-align:start;height:210px;object-fit:cover;border-radius:16px}
.vf{position:relative;padding-top:56.25%;border-radius:16px;overflow:hidden;margin-bottom:8px}.vf iframe{position:absolute;inset:0;width:100%;height:100%;border:0}video{width:100%;border-radius:16px;margin-bottom:8px}
.th{position:relative;display:inline-block;margin:0 8px 8px 0}.th img{width:70px;height:70px;object-fit:cover;border-radius:12px}.th b{position:absolute;top:-6px;right:-6px;background:#ef4444;color:#fff;border-radius:99px;width:20px;height:20px;font-size:11px;display:grid;place-items:center;cursor:pointer}
.gw{position:relative;margin-bottom:8px}.gal{display:flex;gap:0;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;border-radius:16px;margin-bottom:0}.gal::-webkit-scrollbar{display:none}
.gal img{flex:0 0 100%;width:100%;height:auto;aspect-ratio:4/3;max-height:460px;object-fit:cover;scroll-snap-align:start;border-radius:0}
.gn{position:absolute;top:10px;right:10px;background:#0009;color:#fff;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:600}
.gb{position:absolute;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:99px;border:0;background:#fffd;font-size:22px;line-height:1;cursor:pointer;box-shadow:0 2px 8px #0003}.gb.l{left:8px}.gb.r{right:8px}
.cv{width:100%;aspect-ratio:4/3;max-height:460px;object-fit:cover;border-radius:16px;display:block}
</style></head><body>
<div class="app" id="v"></div>
<nav><a href="#/" data-h=""><span>🏠</span>Beranda</a><a href="#/koleksi" data-h="koleksi"><span>🌿</span>Koleksi</a><a href="#/tambah" data-h="tambah"><span>➕</span>Tambah</a><a href="#/aktivitas" data-h="aktivitas"><span>🌟</span>Aktivitas</a><a href="#/tentang" data-h="tentang"><span>📖</span>Tentang</a></nav>
<div id="modal"></div><div id="toast"></div>
<script src="config.js"></script>
<script>
// ====== PENGATURAN FIREBASE (opsional, agar data dibagikan ke semua pengunjung) ======
// Isi dengan konfigurasi dari Firebase Console. Jika dibiarkan null, data hanya tersimpan di perangkat masing-masing.
const CLD=(window.CLOUDINARY_CONFIG&&window.CLOUDINARY_CONFIG.cloud&&window.CLOUDINARY_CONFIG.preset)?window.CLOUDINARY_CONFIG:null;
const FB = window.FB_CONFIG || null; // konfigurasi Firebase ada di file config.js

const DEF={main:{u:'kepalaadiwiyata',p:'smpn19jaya'},admins:[],logo:'',photo:'',
types:['Tanaman Hias','Tanaman Obat','Tanaman Buah','Tanaman Sayur','Pohon Peneduh'],
about:{def:'Smart Plant QR adalah program pendataan tanaman sekolah berbasis kode QR. Setiap tanaman memiliki kode QR yang bila dipindai menampilkan nama, manfaat, ciri-ciri, cara perawatan, dan fakta menariknya.',
goal:'1. Mengenalkan jenis tanaman di lingkungan sekolah.\n2. Meningkatkan kepedulian warga sekolah terhadap lingkungan.\n3. Menjadikan lingkungan sekolah sebagai sumber belajar.',
adi:'Smart Plant QR mendukung program Adiwiyata, yaitu program sekolah peduli dan berbudaya lingkungan, dengan menjadikan kebun dan tanaman sekolah sebagai media belajar yang menarik.'}};
const SEC=[['💊','Manfaat','manfaat'],['🔍','Ciri-ciri','ciri'],['💧','Cara Perawatan','rawat'],['🏞️','Habitat','habitat'],['✨','Fakta Menarik','fakta'],['🌍','Peran Lingkungan','peran']];
let fs=null;if(FB&&window.firebase){firebase.initializeApp(FB);fs=firebase.firestore();fs.enablePersistence({synchronizeTabs:true}).catch(()=>{})}
const L={get:k=>JSON.parse(localStorage.getItem(k)||'null'),set:(k,v)=>localStorage.setItem(k,JSON.stringify(v))};
const loc=f=>{const a=L.get('plants')||[];f(a);L.set('plants',a)};
const API={
 async site(o){const s=fs?(await fs.doc('app/site').get(o&&{source:o})).data():L.get('site');return{...DEF,...(s||{})}},
 async saveSite(s){fs?await fs.doc('app/site').set(s):L.set('site',s)},
 async plants(o){if(fs)return(await fs.collection('plants').get(o&&{source:o})).docs.map(d=>({id:d.id,...d.data()}));return L.get('plants')||[]},
 async add(p){fs?await fs.collection('plants').add(p):loc(a=>a.push({...p,id:'p'+Date.now()}))},
 async upd(id,p){fs?await fs.collection('plants').doc(id).update(p):loc(a=>Object.assign(a.find(x=>x.id===id),p))},
 async del(id){fs?await fs.collection('plants').doc(id).delete():L.set('plants',(L.get('plants')||[]).filter(x=>x.id!==id))},
 async acts(o){if(fs)return(await fs.collection('activities').get(o&&{source:o})).docs.map(d=>({id:d.id,...d.data()}));return L.get('acts')||[]},
 async addAct(a){fs?await fs.collection('activities').add(a):L.set('acts',[...(L.get('acts')||[]),{...a,id:'a'+Date.now()}])},
 async delAct(id){fs?await fs.collection('activities').doc(id).delete():L.set('acts',(L.get('acts')||[]).filter(x=>x.id!==id))},
 async updAct(id,a){fs?await fs.collection('activities').doc(id).update(a):L.set('acts',(L.get('acts')||[]).map(x=>x.id===id?{...x,...a}:x))},
 async inc(id,f){fs?await fs.collection('plants').doc(id).update({[f]:firebase.firestore.FieldValue.increment(1)}):loc(a=>{const p=a.find(x=>x.id===id);p[f]=(p[f]||0)+1})}
};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=s=>document.querySelector(s);
let S={ready:false,site:DEF,plants:[],admin:JSON.parse(sessionStorage.admin||'null'),f:'Semua',acts:[]};
const toast=m=>{const t=$('#toast');t.textContent=m;t.className='show';setTimeout(()=>t.className='',2200)};
const modal=h=>{$('#modal').innerHTML='<div class="mbox">'+h+'</div>';$('#modal').style.display='flex'};
const closeM=()=>$('#modal').style.display='none';
const comp=(f,m=700)=>new Promise(r=>{const fr=new FileReader();fr.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,m/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.72))};i.src=fr.result};fr.readAsDataURL(f)});
const th=(u,w)=>u&&u.indexOf('res.cloudinary.com')>0&&u.indexOf('/upload/')>0?u.replace('/upload/','/upload/w_'+w+',q_auto,f_auto/'):u;
const cu=async d=>{const fd=new FormData();fd.append('file',d);fd.append('upload_preset',CLD.preset);
try{const r=await fetch('https://api.cloudinary.com/v1_1/'+CLD.cloud+'/image/upload',{method:'POST',body:fd}),j=await r.json();if(!j.secure_url)throw new Error(j.error&&j.error.message||'gagal');return j.secure_url}
catch(e){toast('Gagal mengunggah foto ❌');throw e}};
const up=async(f,m)=>CLD?cu(await comp(f,1200)):comp(f,m);
const isD=u=>typeof u=='string'&&u.startsWith('data:');
const pend=()=>S.plants.filter(p=>isD(p.foto)).length+S.acts.reduce((n,a)=>n+med(a).filter(isD).length,0)+['logo','photo'].filter(k=>isD(S.site[k])).length;
async function migrate(){if(!CLD)return;$('#mgb').disabled=true;const say=t=>$('#mg').textContent=t;let i=0;const t=pend();
try{
for(const p of S.plants)if(isD(p.foto)){p.foto=await cu(p.foto);await API.upd(p.id,{foto:p.foto});say('Memindahkan '+(++i)+'/'+t+'...')}
for(const a of S.acts){const f=med(a);if(f.some(isD)){const n=[];for(const x of f){const d=isD(x);n.push(d?await cu(x):x);if(d)say('Memindahkan '+(++i)+'/'+t+'...')}a.fotos=n;a.foto='';await API.updAct(a.id,{fotos:n,foto:''})}}
let ch=0;for(const k of['logo','photo'])if(isD(S.site[k])){S.site[k]=await cu(S.site[k]);ch=1;say('Memindahkan '+(++i)+'/'+t+'...')}
if(ch)await API.saveSite(S.site);
say('Selesai ✅ '+i+' foto dipindahkan.');toast('Selesai ✅')}catch(e){say('Terhenti: '+(e.message||'gagal')+'. Tekan tombol lagi untuk melanjutkan.');$('#mgb').disabled=false}}
let boot=true;
const hs=t=>{let x=0;for(let i=0;i<t.length;i++)x=(x*31+t.charCodeAt(i))|0;return x};
const sig=a=>a.map(x=>x.id+hs(JSON.stringify(x))).join();
const idle=()=>{const f=document.activeElement;return!f||!/INPUT|TEXTAREA/.test(f.tagName)};
async function load(){
const f0=boot;boot=false;
if(f0&&fs){try{const[a,b,c]=await Promise.all([API.site('cache'),API.plants('cache'),API.acts('cache')]);if(b.length||c.length){S.site=a;S.plants=b;S.acts=c;S.actsReady=true;S.ready=true;route()}}catch(e){}}
const was=S.ready,sp=sig(S.plants),ss=JSON.stringify(S.site);
try{const[a,b]=await Promise.all([API.site(),API.plants()]);S.site=a;S.plants=b;S.ready=true;
if(!f0||!was||(sig(b)!==sp||JSON.stringify(a)!==ss)&&idle())route()}
catch(e){console.error(e);S.ready=true;toast('Gagal terhubung ke database');route()}
try{const c=await API.acts(),sa=sig(S.acts);S.acts=c;S.actsReady=true;if(!f0||sig(c)!==sa||!was)if(f0?idle():true)route()}catch(e){console.error(e);S.actsReady=true}
}
let AF=[];
const med=a=>a.fotos||(a.foto?[a.foto]:[]);
const thumbs=()=>AF.map((f,i)=>`<span class="th"><img src="${th(f,150)}" alt=""><b onclick="AF.splice(${i},1);$('#th').innerHTML=thumbs()">✖</b></span>`).join('');
async function addPh(el){for(const f of [...el.files]){if(AF.length>=(CLD?12:6)){toast('Maksimal '+(CLD?12:6)+' foto');break}AF.push(await up(f,720))}el.value='';$('#th').innerHTML=thumbs()}
function actForm(a){AF=[...(a?med(a):[])];return back(a?'✏️ Edit Aktivitas':'➕ Tambah Aktivitas','#/guru/aktivitas')+`<div class="panel"><label class="l">Judul kegiatan</label><input id="aj" value="${esc(a?.judul)}"><label class="l">Tanggal</label><input id="at" type="date" value="${esc(a?.tanggal)}"><label class="l">Keterangan</label><textarea id="ad" rows="4">${esc(a?.desk)}</textarea><label class="l">📷 Foto (boleh lebih dari satu, maks. ${CLD?12:6})</label><div id="th">${thumbs()}</div><input type="file" accept="image/*" multiple onchange="addPh(this)"><label class="l">🎬 Video (tempel tautan YouTube atau Google Drive, satu tautan per baris)</label><textarea id="av" rows="3" placeholder="https://youtu.be/...">${esc((a?.videos||[]).join('\n'))}</textarea><button class="btn g" onclick="saveAct('${a?a.id:''}')">💾 Simpan</button></div>`}
async function saveAct(id){const j=$('#aj').value.trim();if(!j)return toast('Judul wajib diisi');
const d={judul:j,tanggal:$('#at').value,desk:$('#ad').value.trim(),fotos:AF,foto:'',videos:$('#av').value.split('\n').map(x=>x.trim()).filter(Boolean)};
if(JSON.stringify(d).length>900000)return toast('Ukuran foto terlalu besar, kurangi jumlah foto');
id?await API.updAct(id,d):await API.addAct(d);toast('Tersimpan ✅');await load();location.hash='#/guru/aktivitas'}
async function delAct(id){if(!confirm('Hapus aktivitas ini?'))return;await API.delAct(id);toast('Dihapus');load()}

const head=()=>`<header><div class="brand"><div class="logo">${S.site.logo?`<img src="${th(S.site.logo,150)}">`:'🌿'}</div><div><h1>Smart Plant QR</h1><small>SMPN 19 Kota Pontianak</small></div></div><button class="btn" onclick="guru()">${S.admin?'🔓':'🔐'} Mode Guru</button></header>`;
const card=p=>`<a class="card" href="#/tanaman/${p.id}"><img src="${th(p.foto,400)}" alt=""><div class="ci"><b>${esc(p.nama)}</b><i>${esc(p.ilmiah)}</i><span class="tag">${esc(p.jenis)}</span><div><small>🔢 ${p.jumlah||1} &nbsp; ❤️ ${p.likes||0} &nbsp; 👁️ ${p.views||0}</small></div></div></a>`;

const fd=t=>t?new Date(t).toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'}):'';
const sortA=()=>[...S.acts].sort((a,b)=>(b.tanggal||'').localeCompare(a.tanggal||''));
const vid=u=>{let m;if(!/^https?:\/\//.test(u))return '';
if(m=u.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|shorts\/|embed\/))([\w-]{11})/))return `<div class="vf"><iframe src="https://www.youtube.com/embed/${m[1]}" allowfullscreen loading="lazy"></iframe></div>`;
if(m=u.match(/drive\.google\.com\/file\/d\/([\w-]+)/))return `<div class="vf"><iframe src="https://drive.google.com/file/d/${m[1]}/preview" allowfullscreen loading="lazy"></iframe></div>`;
if(/\.(mp4|webm|ogg)(\?|$)/i.test(u))return `<video controls preload="metadata" src="${esc(u)}"></video>`;
return `<a class="btn w" target="_blank" rel="noopener" href="${esc(u)}">▶️ Tonton video</a><br><br>`};
const gal=(a,c)=>{const f=med(a);if(!f.length)return'';if(c)return `<div class="gw"><img class="cv" src="${th(f[0],700)}" alt="" loading="lazy" decoding="async">${f.length>1?`<span class="gn">📷 ${f.length}</span>`:''}</div>`;return `<div class="gw"><div class="gal" onscroll="gs(this)">${f.map(x=>`<img src="${th(x,900)}" alt="" loading="lazy" decoding="async">`).join('')}</div>${f.length>1?`<span class="gn">1/${f.length}</span><button class="gb l" onclick="gm(this,-1)">‹</button><button class="gb r" onclick="gm(this,1)">›</button>`:''}</div>`};
const gm=(b,d)=>{const g=b.parentNode.querySelector('.gal');g.scrollBy({left:d*g.clientWidth,behavior:'smooth'})};
const gs=g=>{const n=g.parentNode.querySelector('.gn');if(n)n.textContent=(Math.round(g.scrollLeft/g.clientWidth)+1)+'/'+g.children.length};
function dlQR(id){const p=S.plants.find(x=>x.id===id),t=document.createElement('div');
new QRCode(t,{text:location.href.split('#')[0]+'#/tanaman/'+id,width:560,height:560,correctLevel:QRCode.CorrectLevel.M});
const q=t.querySelector('canvas'),c=document.createElement('canvas');c.width=680;c.height=820;const x=c.getContext('2d');
x.fillStyle='#fff';x.fillRect(0,0,680,820);x.drawImage(q,60,50,560,560);x.textAlign='center';
x.fillStyle='#0f766e';x.font='bold 38px Poppins,sans-serif';x.fillText(p.nama,340,672,600);
x.fillStyle='#64748b';x.font='italic 26px Poppins,sans-serif';x.fillText(p.ilmiah||'',340,712,600);
x.font='22px Poppins,sans-serif';x.fillText('Smart Plant QR · SMPN 19 Kota Pontianak',340,775,620);
c.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='QR-'+(p.nama.replace(/[^\w]+/g,'-')||'tanaman')+'.jpg';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000)},'image/jpeg',.95);toast('Mengunduh QR ✅')}
const actCard=(a,c)=>`<div class="panel">${gal(a,c)}${c?((a.videos||[]).length?`<small>🎬 ${a.videos.length} video</small><br>`:''):(a.videos||[]).map(vid).join('')}<h3>${esc(a.judul)}</h3><small>📅 ${fd(a.tanggal)}</small><p class="${c?'cl':''}">${esc(a.desk)}</p></div>`;
const actSec=()=>`<h3 style="margin:8px 0;color:#7c3aed">🌟 Aktivitas Adiwiyata</h3>${S.acts.length?sortA().slice(0,3).map(a=>actCard(a,1)).join('')+'<a class="btn g" href="#/aktivitas">Lihat semua aktivitas</a>':(S.actsReady?'<div class="panel">Belum ada aktivitas. Guru dapat menambahkannya lewat Mode Guru.</div>':'<div class="panel">⏳ Memuat aktivitas...</div>')}`;
const aktivitas=()=>`<h3 style="margin-bottom:8px;color:#7c3aed">🌟 Aktivitas Adiwiyata</h3>${S.acts.length?sortA().map(a=>actCard(a)).join(''):'<div class="panel">Belum ada aktivitas.</div>'}`;
function home(){const n=S.plants.length,tot=S.plants.reduce((s,p)=>s+(p.jumlah||1),0),j=new Set(S.plants.map(p=>p.jenis)).size,fk=S.plants.filter(p=>p.fakta),f=fk.length?fk[Math.floor(Math.random()*fk.length)]:null;
return `<div class="hero" style="${S.site.photo?`background-image:url(${th(S.site.photo,1000)})`:''}"><div><h2>🌱 Kenali Tanaman di Sekitarmu</h2></div></div>
<div class="stats"><div class="stat s1"><b>🌳 ${n}</b>Tanaman</div><div class="stat s2"><b>🏷️ ${j}</b>Jenis</div><div class="stat s3"><b>🌲 ${tot}</b>Seluruhnya (jumlah tanaman di sekolah)</div></div>
<div class="panel fact"><h3>✨ Fakta Menarik</h3>${f?`<p><b>${esc(f.nama)}</b>: ${esc(f.fakta)}</p>`:'<p>Belum ada fakta. Tambahkan tanaman pertama untuk memulai.</p>'}<br><button class="btn w" onclick="route()">🔄 Fakta lainnya</button></div>${actSec()}`}

function koleksi(){const ts=['Semua',...S.site.types],l=S.plants.filter(p=>S.f==='Semua'||p.jenis===S.f);
return `<h3 style="margin-bottom:8px">🌿 Koleksi Tanaman</h3><div class="chips">${ts.map(t=>`<button class="chip ${t===S.f?'on':''}" data-t="${esc(t)}" onclick="S.f=this.dataset.t;route()">${esc(t)}</button>`).join('')}</div>
${l.length?`<div class="grid">${l.map(card).join('')}</div>`:'<div class="panel">Belum ada tanaman di kategori ini. <a href="#/tambah">Tambah tanaman</a></div>'}`}

function detail(id){const p=S.plants.find(x=>x.id===id);if(!p)return'<div class="panel">Tanaman tidak ditemukan. <a href="#/koleksi">Kembali ke koleksi</a></div>';
if(!sessionStorage['v'+id]){sessionStorage['v'+id]=1;API.inc(id,'views');p.views=(p.views||0)+1}
return `<a class="btn w" href="#/koleksi">⬅️ Kembali</a><br><br><img class="pimg" src="${th(p.foto,900)}" alt="${esc(p.nama)}">
<div class="ic"><button class="pill" id="lk" onclick="like('${id}')">${sessionStorage['l'+id]?'❤️':'🤍'} ${p.likes||0}</button><span class="pill">👁️ ${p.views}</span><button class="btn g" style="margin-left:auto" onclick="qr('${id}')">⬇️ Unduh QR</button>${S.admin?`<a class="btn" href="#/edit/${id}">✏️ Edit</a>`:''}</div>
<div class="panel"><h2>${esc(p.nama)}</h2><i style="color:#64748b">${esc(p.ilmiah)}</i><br><span class="tag">🏷️ ${esc(p.jenis)}</span> <span class="tag" style="background:#fef3c7;color:#b45309">🔢 ${p.jumlah||1} tanaman di sekolah</span></div>
${SEC.map(([e,t,k])=>p[k]?`<div class="panel"><h3>${e} ${t}${k=='fakta'?' – '+esc(p.nama):''}</h3><p>${esc(p[k])}</p></div>`:'').join('')}`}

function like(id){if(sessionStorage['l'+id])return toast('Kamu sudah menyukai tanaman ini 💚');sessionStorage['l'+id]=1;const p=S.plants.find(x=>x.id===id);p.likes=(p.likes||0)+1;API.inc(id,'likes');$('#lk').innerHTML='❤️ '+p.likes;toast('Terima kasih! ❤️')}
function qr(id){const p=S.plants.find(x=>x.id===id);modal(`<h3>${esc(p.nama)}</h3><div id="qrc" style="display:flex;justify-content:center;margin:14px"></div><small>Pindai untuk melihat informasi tanaman</small><br><br><button class="btn g noprint" onclick="dlQR('${id}')">⬇️ Unduh JPG</button> <button class="btn w noprint" onclick="closeM()">Tutup</button>`);
new QRCode($('#qrc'),{text:location.href.split('#')[0]+'#/tanaman/'+id,width:200,height:200})}

function tentang(){const a=S.site.about;return `<div class="panel" style="text-align:center"><h2 style="font-size:20px">🌿 SMART PLANT QR<br>SMPN 19 KOTA PONTIANAK</h2></div>
<div class="panel"><h3>💡 Pengertian Smart Plant QR</h3><p>${esc(a.def)}</p></div><div class="panel"><h3>🎯 Tujuan Program</h3><p>${esc(a.goal)}</p></div><div class="panel"><h3>♻️ Hubungan dengan Adiwiyata</h3><p>${esc(a.adi)}</p></div>`}

function form(p){window.J=p?p.jenis:'';const v=k=>esc(p?p[k]:'');
const ta=(k,l)=>`<label class="l">${l}</label><textarea id="${k}" rows="3">${v(k)}</textarea>`;
return `<div class="panel"><h2>${p?'✏️ Edit Tanaman':'➕ Tambah Tanaman'}</h2>
<label class="l">🌱 Nama tanaman</label><input id="nama" value="${v('nama')}">
<label class="l">🔬 Nama ilmiah</label><input id="ilmiah" value="${v('ilmiah')}">
<label class="l">🏷️ Jenis tanaman</label><div class="chips wrap">${S.site.types.map(t=>`<button type="button" class="chip ${t===J?'on':''}" data-t="${esc(t)}" onclick="J=this.dataset.t;document.querySelectorAll('.chips.wrap .chip').forEach(c=>c.classList.toggle('on',c==this))">${esc(t)}</button>`).join('')}</div>
<label class="l">🔢 Jumlah tanaman ini di sekolah</label><input id="jumlah" type="number" min="1" value="${p?(p.jumlah||1):1}">${ta('manfaat','💊 Manfaat')}${ta('ciri','🔍 Ciri-ciri')}${ta('rawat','💧 Cara perawatan')}${ta('habitat','🏞️ Habitat')}${ta('fakta','✨ Fakta menarik')}${ta('peran','🌍 Peran lingkungan')}
<label class="l">📷 Foto tanaman ${p?'(kosongkan jika tidak diganti)':''}</label><input type="file" id="foto" accept="image/*">
<button class="btn g" onclick="save('${p?p.id:''}')">💾 Simpan</button></div>`}
async function save(id){const g=i=>$('#'+i).value.trim(),f=$('#foto').files[0];
if(!g('nama')||!J)return toast('Nama dan jenis wajib diisi');
const old=id&&S.plants.find(p=>p.id===id);if(!f&&!old)return toast('Foto wajib diunggah');
const d={nama:g('nama'),jumlah:Math.max(1,parseInt(g('jumlah'))||1),ilmiah:g('ilmiah'),jenis:J,manfaat:g('manfaat'),ciri:g('ciri'),rawat:g('rawat'),habitat:g('habitat'),fakta:g('fakta'),peran:g('peran')};
if(f)d.foto=await up(f,700);
id?await API.upd(id,d):await API.add({...d,likes:0,views:0});
toast('Tersimpan ✅');await load();location.hash=id?'#/tanaman/'+id:'#/koleksi'}

// ===== Mode Guru =====
function guru(){if(S.admin)return location.hash='#/guru';
modal(`<h3 style="color:#7c3aed">🔐 Mode Guru</h3><br><input id="lu" placeholder="Username"><input id="lp" type="password" placeholder="PIN"><button class="btn g" onclick="login()">Masuk</button> <button class="btn w" onclick="closeM()">Batal</button>`)}
function login(){const u=$('#lu').value.trim(),p=$('#lp').value.trim(),s=S.site;let a=null;
if(u===s.main.u&&p===s.main.p)a={u,main:true};else if(s.admins.some(x=>x.u===u&&x.p===p))a={u,main:false};
if(!a)return toast('Username atau PIN salah ❌');S.admin=a;sessionStorage.admin=JSON.stringify(a);closeM();if(!/^#\/tanaman/.test(location.hash))location.hash='#/guru';route()}
function logout(){S.admin=null;sessionStorage.removeItem('admin');location.hash='#/';route()}
const sv=async m=>{await API.saveSite(S.site);toast(m||'Tersimpan ✅');route()};
async function setImg(k,el){const f=el.files[0];if(!f)return;S.site[k]=await up(f,k=='logo'?300:900);sv('Gambar diperbarui ✅')}
const addType=()=>{const t=$('#nt').value.trim();if(!t)return;S.site.types.push(t);sv()};
const delType=i=>{if(confirm('Hapus jenis ini?')){S.site.types.splice(i,1);sv()}};
async function delPlant(id){if(!confirm('Hapus tanaman ini?'))return;await API.del(id);toast('Dihapus');load()}
const saveAbout=()=>{S.site.about={def:$('#a1').value,goal:$('#a2').value,adi:$('#a3').value};sv()};
function setMain(){const u=$('#mu').value.trim(),p=$('#mp').value.trim();if(!u||!p)return toast('Isi username dan PIN');S.site.main={u,p};S.admin.u=u;sessionStorage.admin=JSON.stringify(S.admin);sv('Admin utama diperbarui ✅')}
function addAdm(){const u=$('#au').value.trim(),p=$('#ap').value.trim();if(!u||!p)return toast('Isi username dan PIN');if(u===S.site.main.u||S.site.admins.some(x=>x.u===u))return toast('Username sudah dipakai');S.site.admins.push({u,p});sv('Admin ditambahkan ✅')}
const delAdm=i=>{if(confirm('Hapus admin ini?')){S.site.admins.splice(i,1);sv()}};
const back=(t,h='#/guru')=>`<a class="btn w" href="${h}">⬅️ Kembali</a><h2 style="margin:12px 0;color:#0f766e">${t}</h2>`;
const fl=el=>{const q=el.value.toLowerCase();document.querySelectorAll('[data-n]').forEach(r=>r.style.display=r.dataset.n.includes(q)?'':'none')};
const gc=(h,c,e,t)=>`<a class="gc" href="${h}"><i style="background:${c}">${e}</i>${t}</a>`;
function panel(b,c){
if(!S.admin)return'<div class="panel">Silakan masuk lewat tombol Mode Guru.</div>';
const s=S.site,m=S.admin.main,a=s.about;
if(b=='gambar')return back('🖼️ Gambar Beranda &amp; Logo')+`<div class="panel"><label class="l">Foto sekolah</label><input type="file" accept="image/*" onchange="setImg('photo',this)"><label class="l">Logo Smart Plant QR</label><input type="file" accept="image/*" onchange="setImg('logo',this)"></div>`;
if(b=='jenis')return back('🏷️ Jenis Tanaman')+`<div class="panel">${s.types.map((t,i)=>`<div class="row">${esc(t)}<button class="btn r" onclick="delType(${i})">🗑️</button></div>`).join('')}<br><input id="nt" placeholder="Jenis baru, mis. Tanaman Air"><button class="btn g" onclick="addType()">➕ Tambah jenis</button></div>`;
if(b=='info')return back('🌱 Info Tanaman')+`<a class="btn g" href="#/tambah">➕ Tambah tanaman</a><br><br><input placeholder="🔍 Cari tanaman..." oninput="fl(this)"><div class="panel"><small>${S.plants.length} tanaman</small>${S.plants.map(p=>`<div class="row" data-n="${esc((p.nama+' '+p.jenis).toLowerCase())}"><span>${esc(p.nama)}<br><small>${esc(p.jenis)} · ${p.jumlah||1} pohon</small></span><span><a class="btn w" href="#/edit/${p.id}">✏️</a> <button class="btn r" onclick="delPlant('${p.id}')">🗑️</button></span></div>`).join('')||'<p>Belum ada tanaman.</p>'}</div>`;
if(b=='aktivitas'){if(c=='baru')return actForm();if(c){const x=S.acts.find(y=>y.id===c);if(x)return actForm(x)}
return back('🌟 Aktivitas')+`<a class="btn g" href="#/guru/aktivitas/baru">➕ Tambah aktivitas</a><br><br><input placeholder="🔍 Cari aktivitas..." oninput="fl(this)"><div class="panel"><small>${S.acts.length} aktivitas</small>${sortA().map(x=>`<div class="row" data-n="${esc((x.judul||'').toLowerCase())}"><span>${esc(x.judul)}<br><small>📅 ${fd(x.tanggal)} · 📷 ${med(x).length} · 🎬 ${(x.videos||[]).length}</small></span><span><a class="btn w" href="#/guru/aktivitas/${x.id}">✏️</a> <button class="btn r" onclick="delAct('${x.id}')">🗑️</button></span></div>`).join('')||'<p>Belum ada aktivitas.</p>'}</div>`}
if(b=='migrasi'&&CLD)return back('☁️ Pindahkan Foto')+`<div class="panel"><p>Memindahkan foto lama (yang tersimpan di database) ke Cloudinary agar aplikasi lebih ringan. Foto yang belum dipindahkan: <b>${pend()}</b>.</p><br><button class="btn g" id="mgb" onclick="migrate()">☁️ Mulai pindahkan</button><p id="mg" style="margin-top:12px;font-weight:600"></p></div>`;
if(b=='tentang')return back('📖 Tentang Program')+`<div class="panel"><label class="l">Pengertian</label><textarea id="a1" rows="4">${esc(a.def)}</textarea><label class="l">Tujuan</label><textarea id="a2" rows="4">${esc(a.goal)}</textarea><label class="l">Hubungan dengan Adiwiyata</label><textarea id="a3" rows="4">${esc(a.adi)}</textarea><button class="btn g" onclick="saveAbout()">💾 Simpan</button></div>`;
if(b=='admin'&&m)return back('👥 Admin &amp; Akun')+`<div class="panel"><label class="l">Username admin utama</label><input id="mu" value="${esc(s.main.u)}"><label class="l">PIN admin utama</label><input id="mp" value="${esc(s.main.p)}"><button class="btn" onclick="setMain()">Ubah</button><br><br><b style="font-size:13px">Admin biasa</b>${s.admins.map((x,i)=>`<div class="row">${esc(x.u)}<button class="btn r" onclick="delAdm(${i})">🗑️</button></div>`).join('')||'<p>Belum ada.</p>'}<br><input id="au" placeholder="Username admin baru"><input id="ap" placeholder="PIN admin baru"><button class="btn g" onclick="addAdm()">➕ Tambah admin</button></div>`;
return `<div class="gh"><h2>👩‍🏫 Mode Guru</h2><p>Halo, <b>${esc(S.admin.u)}</b> · ${m?'Admin utama':'Admin'} · kelola konten Smart Plant QR di sini.</p></div><div class="gg">${gc('#/guru/gambar','#0ea5e9','🖼️','Gambar Beranda &amp; Logo')}${gc('#/guru/jenis','#8b5cf6','🏷️','Jenis Tanaman')}${gc('#/guru/info','#10b981','🌱','Info Tanaman')}${gc('#/guru/aktivitas','#14b8a6','🌟','Aktivitas')}${gc('#/guru/tentang','#f59e0b','📖','Tentang Program')}${m?gc('#/guru/admin','#ec4899','👥','Admin &amp; Akun'):''}${CLD?gc('#/guru/migrasi','#6366f1','☁️','Pindahkan Foto'):''}<a class="gc" href="#" onclick="logout();return false"><i style="background:#ef4444">🚪</i>Keluar</a></div>`}

function detailEdit(p){window.J=p.jenis;
return `<a class="btn w" href="#/tanaman/${p.id}">⬅️ Batal</a><h2 style="margin:12px 0;color:#0f766e">✏️ Edit Informasi Tanaman</h2>
<img class="pimg" src="${th(p.foto,700)}" alt=""><div class="panel" style="margin-top:12px"><label class="l">📷 Ganti foto (kosongkan jika tidak diganti)</label><input type="file" id="foto" accept="image/*"></div>
<div class="panel"><label class="l">🌱 Nama tanaman</label><input id="nama" value="${esc(p.nama)}"><label class="l">🔬 Nama ilmiah</label><input id="ilmiah" value="${esc(p.ilmiah)}"><label class="l">🔢 Jumlah di sekolah</label><input id="jumlah" type="number" min="1" value="${p.jumlah||1}"><label class="l">🏷️ Jenis tanaman</label><div class="chips wrap">${S.site.types.map(t=>`<button type="button" class="chip ${t===J?'on':''}" data-t="${esc(t)}" onclick="J=this.dataset.t;document.querySelectorAll('.chips.wrap .chip').forEach(c=>c.classList.toggle('on',c==this))">${esc(t)}</button>`).join('')}</div></div>
${SEC.map(([e,t,k])=>`<div class="panel"><h3>${e} ${t}</h3><textarea id="${k}" rows="4">${esc(p[k])}</textarea></div>`).join('')}
<button class="btn g" onclick="save('${p.id}')">💾 Simpan perubahan</button> <a class="btn w" href="#/tanaman/${p.id}">Batal</a>`}
function route(){const[,a,b,c]=(location.hash||'#/').split('/');let v;
if(!S.ready){$('#v').innerHTML=head()+'<div class="panel" style="text-align:center;font-weight:600;color:#0f766e;padding:40px 16px">🌱 Memuat data tanaman...</div>';return}
if(a=='koleksi')v=koleksi();else if(a=='tambah')v=form();else if(a=='tentang')v=tentang();else if(a=='aktivitas')v=aktivitas();else if(a=='tanaman')v=detail(b);
else if(a=='edit'){const p=S.plants.find(x=>x.id===b);v=S.admin&&p?detailEdit(p):panel()}else if(a=='guru')v=panel(b,c);else v=home();
$('#v').innerHTML=head()+v;
document.querySelectorAll('nav a').forEach(x=>x.classList.toggle('on',x.dataset.h===(a=='tanaman'?'koleksi':a||'')));}
addEventListener('hashchange',()=>{route();scrollTo(0,0)});
$('#modal').onclick=e=>{if(e.target.id=='modal')closeM()};
document.addEventListener('contextmenu',e=>{if(!/INPUT|TEXTAREA/.test(e.target.tagName))e.preventDefault()});
document.addEventListener('selectstart',e=>{if(!/INPUT|TEXTAREA/.test(e.target.tagName))e.preventDefault()});
document.addEventListener('touchmove',e=>{if(e.touches.length>1)e.preventDefault()},{passive:false});
['gesturestart','gesturechange','dragstart'].forEach(t=>document.addEventListener(t,e=>e.preventDefault()));
route();load();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js'));
</script></body></html>
